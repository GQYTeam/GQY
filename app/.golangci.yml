version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104
        # 本地优先工具按配置路径读写、按 manifest 执行插件/一次性命令；
        # 路径校验在 storage.EnsureInside、plugin.ValidID、oneshot 校验中完成。
        - G304
        - G204
        - G703
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
          - gocritic

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
