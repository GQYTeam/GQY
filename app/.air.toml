# air 热重载配置（开发工具，不影响生产构建）
# 用法：cd app && air
# 监听 Go 源码变化，自动重新编译并重启 gqy-server；前端文件改动无需重启（刷新浏览器即可）。

root = "."
tmp_dir = "tmp/air"

[build]
  cmd = "go build -o tmp/air/gqy-server ./cmd/gqy-server"
  bin = "tmp/air/gqy-server"
  include_ext = ["go", "mod"]
  exclude_dir = ["assets", "docs", "scripts", "styles", "js", "bin", "node_modules", "tmp"]
  delay = 800
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
