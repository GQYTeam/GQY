name: Bug report
description: 报告可复现的缺陷
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。提交前请确认：
        - 已搜索现有 issue
        - 日志里没有 API 密钥、token、prompt 或回复正文
        - 安全漏洞请走私密渠道（见 SECURITY.md），不要开公开 issue
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际行为与预期行为
      placeholder: 预期……实际……
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小可复现步骤或命令
      placeholder: |
        1. 配置 providers.json …
        2. 启动 gqy-server
        3. 请求 /v1/chat/completions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 已脱敏的日志或错误信息
      render: shell
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: v0.1.0 或 commit sha
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Linux
        - Windows
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已删除日志中的密钥与正文
          required: true
        - label: 这不是安全漏洞（安全漏洞请走私密渠道）
          required: true
