name: Feature request
description: 提出能力或工程改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先读 `docs/designs/`。如果提案改变了已有决定，请指出要修改的编号（G/D/R/C/P/…）。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 不用先写方案，先说场景与痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 接口、配置、行为边界
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过但没选的方案
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 网关与路由
        - 协议翻译
        - 插件运行时
        - 会话与产物
        - 工具
        - 评测
        - 前端
        - 存储与配置
        - 工程化
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 issue 与设计文档
          required: true
